<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#e0312a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer red ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring)" stroke-width="40"/>
  <!-- Inner dark circle -->
  <circle cx="256" cy="256" r="90" fill="#111"/>
  <!-- Center lens highlight -->
  <circle cx="256" cy="256" r="48" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <circle cx="256" cy="256" r="24" fill="#222"/>
  <!-- Lens glint -->
  <circle cx="244" cy="244" r="8" fill="rgba(255,255,255,0.15)"/>
  <!-- C letter overlay -->
  <path d="M 310 196 A 80 80 0 1 0 310 316" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="14" stroke-linecap="round"/>
</svg>
